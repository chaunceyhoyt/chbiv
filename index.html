<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * { margin: 0; padding: 0; }

  body {
    background: #0d0000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    overflow: hidden;
  }

  /* Faint red noise grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }


  #tv-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Table slices: zero out any gap sources */
  #tv td { padding: 0; font-size: 0; line-height: 0; border: 0; }
  #tv img { display: block; }

  /* Red glow around the TV — on overlay div, never touches the table */
  #tv-glow {
    position: absolute;
    inset: 0;
    box-shadow:
      0 0 12px 2px rgba(255,0,0,0.8),
      0 0 40px 8px rgba(180,0,0,0.5),
      0 0 80px 16px rgba(100,0,0,0.3);
    pointer-events: none;
    z-index: 20;
  }

  #tv {
    max-width: 858px;
    position: relative;
  }

  /* Screen area */
  #screen-wrap {
    position: relative;
    width: 649px;
    height: 378px;
  }

  #screen {
    width: 649px;
    height: 378px;
    position: relative;
    background: #000;
  }

  /* Scanlines — subtle */
  #screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.10) 2px,
      rgba(0,0,0,0.10) 4px
    );
    pointer-events: none;
    z-index: 50;
  }

  /* CRT vignette */
  #screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 51;
  }

  /* Channel OSD — red with RGB chromatic shadow */
  #channel-badge {
    position: absolute;
    top: 10px;
    right: 14px;
    color: #fff;
    font-size: 38px;
    font-family: 'VT323', monospace;
    letter-spacing: 3px;
    text-shadow:
      -2px 0 rgba(255,0,0,0.9),
       2px 0 rgba(0,200,255,0.7);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
  }

  #channel-badge.show {
    opacity: 1;
    animation: fadeout 1.8s forwards;
  }

  @keyframes fadeout {
    0%   { opacity: 1; }
    65%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Mode label — same position as channel badge, shown on input switch */
  #mode-label {
    position: absolute;
    top: 10px;
    right: 14px;
    color: #fff;
    font-size: 38px;
    font-family: 'VT323', monospace;
    letter-spacing: 3px;
    text-shadow:
      -2px 0 rgba(255,0,0,0.9),
       2px 0 rgba(0,200,255,0.7);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
  }

  #mode-label.show {
    opacity: 1;
    animation: fadeout 1.8s forwards;
  }

  /* Buttons */
  img.next, img.prev, img.input-btn {
    cursor: pointer;
    transition: filter 0.12s;
  }

  img.next:hover, img.prev:hover, img.input-btn:hover {
    filter: brightness(1.8) sepia(1) saturate(8) hue-rotate(310deg);
  }

  img.next:active, img.prev:active, img.input-btn:active {
    filter: brightness(3) sepia(1) saturate(10) hue-rotate(310deg);
  }

  /* Ticker — red on black */
  #ticker-wrap {
    width: 858px;
    overflow: hidden;
    margin-top: 6px;
    padding: 3px 0;
    border-top: 1px solid rgba(255,0,0,0.4);
    border-bottom: 1px solid rgba(255,0,0,0.4);
    background: #000;
    position: relative;
    z-index: 10;
  }

  #ticker {
    display: inline-block;
    white-space: nowrap;
    color: #ff2200;
    font-size: 20px;
    letter-spacing: 3px;
    text-shadow: -1px 0 rgba(0,200,255,0.5), 1px 0 rgba(255,0,0,0.5);
    animation: ticker 28s linear infinite;
  }

  @keyframes ticker {
    0%   { transform: translateX(858px); }
    100% { transform: translateX(-100%); }
  }

  /* Static canvas for no-signal */
  #static-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ── Game controller — mobile portrait only ───────────────────── */
  #game-controller {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background: #0d0000;
    border-top: 2px solid rgba(255,0,0,0.5);
    box-shadow: 0 -4px 30px rgba(255,0,0,0.3);
    z-index: 200;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 16px 24px;
    box-sizing: border-box;
    align-items: center;
    justify-content: space-between;
  }

  #game-controller.visible {
    transform: translateY(0);
  }

  /* D-pad */
  #dpad {
    position: relative;
    width: 110px;
    height: 110px;
    flex-shrink: 0;
  }

  .dpad-btn {
    position: absolute;
    width: 36px;
    height: 36px;
    background: #1a0000;
    border: 1px solid rgba(255,0,0,0.4);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff2200;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    active-color: #ff0000;
  }

  .dpad-btn:active { background: rgba(255,0,0,0.3); }

  #dpad-up    { top: 0;    left: 37px; }
  #dpad-down  { bottom: 0; left: 37px; }
  #dpad-left  { top: 37px; left: 0;    }
  #dpad-right { top: 37px; right: 0;   }
  #dpad-center {
    position: absolute;
    top: 37px; left: 37px;
    width: 36px; height: 36px;
    background: #0d0000;
    border: 1px solid rgba(255,0,0,0.2);
    border-radius: 4px;
  }

  /* Center controls (Select + Start) */
  #ctrl-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .small-btn {
    background: #1a0000;
    border: 1px solid rgba(255,0,0,0.4);
    border-radius: 20px;
    color: #ff2200;
    font-family: 'VT323', monospace;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 4px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  .small-btn:active { background: rgba(255,0,0,0.3); }

  /* A + B buttons */
  #ab-buttons {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-shrink: 0;
  }

  .ab-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(255,0,0,0.5);
    background: #1a0000;
    color: #ff2200;
    font-family: 'VT323', monospace;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 0 8px rgba(255,0,0,0.3);
  }

  .ab-btn:active { background: rgba(255,0,0,0.4); }

  /* Only show on mobile portrait */
  @media (max-width: 600px) and (orientation: portrait) {
    #game-controller {
      display: flex;
    }
  }</style>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player;
var currentMode = 0;
var channelIndex = 0;
var channelList = [
  'ExF3Azfa4sc',
  'j95TWbH3BqE',
  'kzJvpfmHS3k',
  'eK0tNJHGXNk',
  'ic7zjjSQa-Q'
];
var channelTimes = channelList.map(function () { return 0; });

var modes = [
  {
    label: 'TV',
    enter: function () {
      $('#screen').html('<div id="video-placeholder"></div>');

      createPlayer();
    },
    leave: function () {
      if (player) {
        channelTimes[channelIndex] = player.getCurrentTime();
        player.destroy();
        player = null;
      }
    }
  },
  {
    label: 'GAME',
    enter: function () {
      $('#screen').html('<iframe src="game/index.html" width="649" height="378" frameborder="0" scrolling="no" style="display:block;"></iframe>');

    },
    leave: function () { $('#screen').empty(); }
  },
  {
    label: 'NO SIGNAL',
    enter: function () {
      $('#screen').html('<canvas id="static-canvas"></canvas>');

      startStatic();
    },
    leave: function () {
      stopStatic();
      $('#screen').empty();
    }
  }
];

// ── Static noise ────────────────────────────────────────────────
var staticFrame;
function startStatic() {
  var canvas = document.getElementById('static-canvas');
  if (!canvas) return;
  canvas.width  = 649;
  canvas.height = 378;
  var ctx = canvas.getContext('2d');
  function draw() {
    var img = ctx.createImageData(649, 378);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random();
      var bright = v > 0.5 ? Math.floor(v * 255) : 0;
      // RGB-split noise: bias toward red with occasional green/blue flecks
      img.data[i]     = bright;
      img.data[i + 1] = Math.random() > 0.92 ? Math.floor(Math.random() * 180) : 0;
      img.data[i + 2] = Math.random() > 0.92 ? Math.floor(Math.random() * 180) : 0;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    staticFrame = requestAnimationFrame(draw);
  }
  draw();
}
function stopStatic() {
  if (staticFrame) { cancelAnimationFrame(staticFrame); staticFrame = null; }
}

// ── YouTube ──────────────────────────────────────────────────────
function createPlayer() {
  if (typeof YT === 'undefined' || !YT.Player) {
    window._pendingPlayer = true;
    return;
  }
  player = new YT.Player('video-placeholder', {
    width: 649,
    height: 378,
    videoId: channelList[channelIndex],
    playerVars: {
      autoplay: 1, controls: 0, loop: 1, rel: 0,
      modestbranding: 1, iv_load_policy: 3, showinfo: 0,
      fs: 0, disablekb: 1, cc_load_policy: 0, playsinline: 1,
      playlist: channelList.join(',')
    },
    events: { onReady: function () {
      if (channelTimes[channelIndex] > 0) {
        player.seekTo(channelTimes[channelIndex], true);
      }
      player.playVideo();
    } }
  });
}

function onYouTubeIframeAPIReady() {
  if (window._pendingPlayer) { window._pendingPlayer = false; createPlayer(); }
}

// ── Channel badge ────────────────────────────────────────────────
function showChannelBadge(n) {
  $('#mode-label').removeClass('show');
  var badge = $('#channel-badge');
  badge.text('CH ' + String(n + 1).padStart(2, '0'));
  badge.removeClass('show');
  void badge[0].offsetWidth;
  badge.addClass('show');
}

function showModeLabel(text) {
  $('#channel-badge').removeClass('show');
  var label = $('#mode-label');
  label.removeClass('show');
  void label[0].offsetWidth;
  label.text(text).addClass('show');
}

// ── Controls ─────────────────────────────────────────────────────
$(document).ready(function () {
  modes[0].enter();

  $('.input-btn').on('click', function () {
    modes[currentMode].leave();
    currentMode = (currentMode + 1) % modes.length;
    modes[currentMode].enter();
    if (modes[currentMode].label === 'TV') {
      showChannelBadge(channelIndex);
      $('#game-controller').removeClass('visible');
    } else if (modes[currentMode].label === 'GAME') {
      showModeLabel(modes[currentMode].label);
      // only slide up on mobile portrait
      if (window.innerWidth <= 600 && window.innerHeight > window.innerWidth) {
        $('#game-controller').addClass('visible');
      }
    } else {
      showModeLabel(modes[currentMode].label);
      $('#game-controller').removeClass('visible');
    }
  });

  // Hide controller if orientation changes away from portrait
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      if (window.innerWidth > window.innerHeight) {
        $('#game-controller').removeClass('visible');
      }
    }, 100);
  });

  $('.next').on('click', function () {
    if (modes[currentMode].label !== 'TV' || !player) return;
    channelTimes[channelIndex] = player.getCurrentTime();
    channelIndex = (channelIndex + 1) % channelList.length;
    player.loadVideoById({ videoId: channelList[channelIndex], startSeconds: channelTimes[channelIndex] });
    showChannelBadge(channelIndex);
  });

  $('.prev').on('click', function () {
    if (modes[currentMode].label !== 'TV' || !player) return;
    channelTimes[channelIndex] = player.getCurrentTime();
    channelIndex = (channelIndex - 1 + channelList.length) % channelList.length;
    player.loadVideoById({ videoId: channelList[channelIndex], startSeconds: channelTimes[channelIndex] });
    showChannelBadge(channelIndex);
  });
});
</script>
