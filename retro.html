<!DOCTYPE html>
<html>
<head>
<title>www.CHBIV.com</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * { margin: 0; padding: 0; }

  body {
    background: #0a0010;
    background-image:
      linear-gradient(180deg, #0a0010 0%, #1a0030 40%, #0d0020 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    overflow: hidden;
  }

  /* Synthwave grid floor */
  body::before {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 45vh;
    background-image:
      linear-gradient(transparent 0%, rgba(255,0,200,0.15) 100%),
      repeating-linear-gradient(90deg, rgba(255,0,200,0.2) 0px, transparent 1px, transparent 60px, rgba(255,0,200,0.2) 61px),
      repeating-linear-gradient(0deg, rgba(255,0,200,0.2) 0px, transparent 1px, transparent 40px, rgba(255,0,200,0.2) 41px);
    transform: perspective(300px) rotateX(40deg);
    transform-origin: bottom center;
    pointer-events: none;
    z-index: 0;
  }

  /* Horizon glow */
  body::after {
    content: '';
    position: fixed;
    bottom: 43vh; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff00c8, #00fff7, #ff00c8, transparent);
    box-shadow: 0 0 20px #ff00c8, 0 0 60px #ff00c8;
    pointer-events: none;
    z-index: 0;
  }

  #tv-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Table slices: zero out any gap sources */
  #tv td { padding: 0; font-size: 0; line-height: 0; border: 0; }
  #tv img { display: block; }

  /* Glow lives on the wrapper — never touches the table or its images */
  #tv-glow {
    position: absolute;
    inset: 0;
    box-shadow:
      0 0 18px 4px #ff00c8,
      0 0 50px 10px #7700ff,
      inset 0 0 30px rgba(119,0,255,0.15);
    pointer-events: none;
    z-index: 20;
  }

  #tv {
    max-width: 858px;
    position: relative;
  }

  /* Tint bezel images — filter on individual imgs is fine once display:block
     is set, and it never touches the screen area */
  #Table_01 img:not(#screen *) {
    filter: hue-rotate(200deg) saturate(1.8) brightness(0.85);
  }

  /* Screen container — sits over the placeholder */
  #screen-wrap {
    position: relative;
    width: 649px;
    height: 378px;
  }

  #screen {
    width: 649px;
    height: 378px;
    position: relative;
    background: #000;
  }

  /* Scanline overlay */
  #screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.35) 2px,
      rgba(0,0,0,0.35) 4px
    );
    pointer-events: none;
    z-index: 50;
  }

  /* CRT vignette */
  #screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 51;
  }

  /* Channel badge that flashes when switching */
  #channel-badge {
    position: absolute;
    top: 12px;
    right: 16px;
    color: #00fff7;
    font-size: 36px;
    font-family: 'VT323', monospace;
    text-shadow: 0 0 10px #00fff7;
    letter-spacing: 2px;
    z-index: 60;
    opacity: 0;
    transition: opacity 0.1s;
    pointer-events: none;
  }

  #channel-badge.show {
    opacity: 1;
    animation: fadeout 1.8s forwards;
  }

  @keyframes fadeout {
    0%   { opacity: 1; }
    60%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Mode label in corner */
  #mode-label {
    position: absolute;
    bottom: 12px;
    left: 14px;
    color: #ff00c8;
    font-size: 20px;
    font-family: 'VT323', monospace;
    text-shadow: 0 0 8px #ff00c8;
    letter-spacing: 2px;
    z-index: 60;
    pointer-events: none;
  }

  /* Button hover — brightness only, no extra hue-rotate needed */
  img.next, img.prev, img.input-btn {
    cursor: pointer;
    transition: filter 0.15s;
  }

  img.next:hover, img.prev:hover, img.input-btn:hover {
    filter: hue-rotate(200deg) saturate(3) brightness(2);
  }

  img.next:active, img.prev:active, img.input-btn:active {
    filter: hue-rotate(200deg) saturate(4) brightness(3);
  }

  /* Footer ticker */
  #ticker-wrap {
    width: 858px;
    overflow: hidden;
    margin-top: 8px;
    padding: 4px 0;
    border-top: 1px solid rgba(255,0,200,0.3);
    border-bottom: 1px solid rgba(255,0,200,0.3);
    background: rgba(0,0,0,0.5);
    position: relative;
    z-index: 10;
  }

  #ticker {
    display: inline-block;
    white-space: nowrap;
    color: #ff00c8;
    font-size: 20px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #ff00c8;
    animation: ticker 28s linear infinite;
  }

  @keyframes ticker {
    0%   { transform: translateX(858px); }
    100% { transform: translateX(-100%); }
  }

  /* No-input static screen */
  #static-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player;
var currentMode = 0;
var channelIndex = 0;
var channelList = [
  'ExF3Azfa4sc',
  'j95TWbH3BqE',
  'kzJvpfmHS3k',
  'eK0tNJHGXNk',
  'ic7zjjSQa-Q'
];

var modes = [
  {
    label: 'TV',
    enter: function () {
      $('#screen').html('<div id="video-placeholder"></div>');
      $('#mode-label').text('TV');
      createPlayer();
    },
    leave: function () {
      if (player) { player.destroy(); player = null; }
    }
  },
  {
    label: 'GAME',
    enter: function () {
      $('#screen').html('<iframe src="game/index.html" width="649" height="378" frameborder="0" scrolling="no" style="display:block;"></iframe>');
      $('#mode-label').text('GAME');
    },
    leave: function () { $('#screen').empty(); }
  },
  {
    label: 'NO SIGNAL',
    enter: function () {
      $('#screen').html('<canvas id="static-canvas"></canvas>');
      $('#mode-label').text('NO SIGNAL');
      startStatic();
    },
    leave: function () {
      stopStatic();
      $('#screen').empty();
    }
  }
];

// ── Static noise ────────────────────────────────────────────────
var staticFrame;
function startStatic() {
  var canvas = document.getElementById('static-canvas');
  if (!canvas) return;
  canvas.width  = 649;
  canvas.height = 378;
  var ctx = canvas.getContext('2d');
  function draw() {
    var img = ctx.createImageData(649, 378);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() > 0.5 ? 255 : 0;
      // tint toward magenta/cyan for that 80s vibe
      img.data[i]     = v * 0.9;
      img.data[i + 1] = v * 0.1;
      img.data[i + 2] = v * 0.9;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    staticFrame = requestAnimationFrame(draw);
  }
  draw();
}
function stopStatic() {
  if (staticFrame) { cancelAnimationFrame(staticFrame); staticFrame = null; }
}

// ── YouTube ──────────────────────────────────────────────────────
function createPlayer() {
  if (typeof YT === 'undefined' || !YT.Player) {
    window._pendingPlayer = true;
    return;
  }
  player = new YT.Player('video-placeholder', {
    width: 649,
    height: 378,
    videoId: channelList[channelIndex],
    playerVars: {
      autoplay: 1, controls: 0, loop: 1, rel: 0,
      modestbranding: 1, iv_load_policy: 3, showinfo: 0,
      fs: 0, disablekb: 1, cc_load_policy: 0, playsinline: 1,
      playlist: channelList.join(',')
    },
    events: { onReady: function () { player.playVideo(); } }
  });
}

function onYouTubeIframeAPIReady() {
  if (window._pendingPlayer) { window._pendingPlayer = false; createPlayer(); }
}

// ── Channel badge ────────────────────────────────────────────────
function showChannelBadge(n) {
  var badge = $('#channel-badge');
  badge.text('CH ' + String(n + 1).padStart(2, '0'));
  badge.removeClass('show');
  void badge[0].offsetWidth; // reflow to restart animation
  badge.addClass('show');
}

// ── Controls ─────────────────────────────────────────────────────
$(document).ready(function () {
  modes[0].enter();

  $('.input-btn').on('click', function () {
    modes[currentMode].leave();
    currentMode = (currentMode + 1) % modes.length;
    modes[currentMode].enter();
  });

  $('.next').on('click', function () {
    if (modes[currentMode].label !== 'TV' || !player) return;
    channelIndex = (channelIndex + 1) % channelList.length;
    player.nextVideo();
    showChannelBadge(channelIndex);
  });

  $('.prev').on('click', function () {
    if (modes[currentMode].label !== 'TV' || !player) return;
    channelIndex = (channelIndex - 1 + channelList.length) % channelList.length;
    player.previousVideo();
    showChannelBadge(channelIndex);
  });
});
</script>
